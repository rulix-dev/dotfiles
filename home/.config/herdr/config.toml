# herdr config, shared by the workspace server and the Mac client.
#
# Who reads what:
# - Keybindings and [ui] come from the client that draws the UI. With
#   `herdr --remote <host>` or saved machines that is the Mac's
#   ~/.config/herdr/config.toml, so copy this file there.
# - Custom commands ([[keys.command]]) belong to the server where the panes
#   run. With `herdr --remote` the server's ones are only active when attaching
#   with `--remote-keybindings server` (or over plain ssh); inside any herdr
#   pane, Alt+s (zsh widget) opens the same picker.

[keys]
# Walk the agent list (all connected machines). Unset by herdr by default.
next_agent = "prefix+a"
previous_agent = "prefix+shift+a"
focus_agent = "prefix+alt+1..9"

[[keys.command]]
key = "prefix+f"
type = "popup"
command = "$HOME/.local/bin/mux pick --mux herdr"
description = "session picker (mux)"
width = "80%"
height = "70%"

[[keys.command]]
key = "prefix+space"
type = "popup"
command = "$HOME/.local/bin/mux palette"
description = "command palette (mux)"
width = "70%"
height = "60%"

[ui]
# Wider sidebar so long workspace labels (w/SDCT-...) fit. Defaults: 26 / 18 / 36.
sidebar_width = 44
sidebar_max_width = 60
